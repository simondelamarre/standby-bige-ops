name: publish-image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Derive immutable image tags
        id: image
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          }
          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/standby-bige-ops"
          commit="$(git rev-parse HEAD)"
          short_sha="${commit:0:12}"
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "minor=${minor}"
            echo "commit=${commit}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the public image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
          MINOR: ${{ steps.image.outputs.minor }}
          COMMIT: ${{ steps.image.outputs.commit }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg "VERSION=${VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${IMAGE}:v${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${MINOR}" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --tag "${IMAGE}:latest" \
            .
      - name: Reject every detected CVE before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}:v${{ steps.image.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      - name: Publish the scanned image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
          MINOR: ${{ steps.image.outputs.minor }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          set -euo pipefail
          for tag in "v${VERSION}" "${VERSION}" "${MINOR}" "sha-${SHORT_SHA}" latest; do
            docker push "${IMAGE}:${tag}"
          done
      - name: Record the published digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:v${VERSION}"
